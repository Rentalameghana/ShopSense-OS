<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - ShopSense OS</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <div class="sidebar">

        <div class="logo">
            <h2>ShopSense OS</h2>
        </div>

        <ul class="menu">

            <li>
                <a href="dashboard.html">🏠 Dashboard</a>
            </li>

            <li>
                <a href="vendors.html">🏢 Vendors</a>
            </li>

            <li>
                <a href="products.html">📦 Products</a>
            </li>

            <li class="active">
                <a href="customers.html">👤 Customers</a>
            </li>

            <li>
                 <a href="transactions.html">💳 Transactions</a>
            </li>

            <li>
                 <a href="analytics.html">📊 Analytics</a>
            </li>

            <li>
                <a href="login.html">🚪 Logout</a>
            </li>

        </ul>

    </div>

    <!-- Main Content -->

    <div class="main-content">

        <div class="header">

            <div>
                <h1>Customer Management</h1>
                <p>Manage all marketplace customers</p>
            </div>

            <div class="admin">
                <h3>Admin</h3>
            </div>

        </div>

        <div id="customerMessage" class="customer-message" role="status" aria-live="polite"></div>

        <!-- Customer Form -->

        <div class="status-box">

            <h2>Add New Customer</h2>

            <br>

            <input
                type="text"
                id="customerName"
                placeholder="Customer Name"
                minlength="2"
                required>

            <br><br>

            <input
                type="email"
                id="customerEmail"
                placeholder="Email"
                required>

            <br><br>

            <input
                type="text"
                id="customerPhone"
                placeholder="Phone Number"
                minlength="10"
                maxlength="15"
                required>

            <br><br>

            <button onclick="addCustomer()">
                Add Customer
            </button>

        </div>

        <!-- Customer Table -->

        <div class="activity">

            <h2>Customer List</h2>

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Total Spending</th>
                        <th>Segment</th>

                    </tr>

                </thead>

                <tbody id="customerTable">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="js/customer.js"></script>

</body>

</html>
