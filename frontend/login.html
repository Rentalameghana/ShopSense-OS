<!DOCTYPE html>
<html>

<head>

    <title>ShopSense OS - Login</title>

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>ShopSense OS</h1>

            <p>Admin Login</p>

            <input 
                type="email" 
                id="email" 
                placeholder="Enter Email"
            >

            <input 
                type="password" 
                id="password" 
                placeholder="Enter Password"
            >

            <button onclick="login()">
                Login
            </button>

        </div>

    </div>


    <script src="./js/login.js"></script>

</body>

</html>
