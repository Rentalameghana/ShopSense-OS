<!DOCTYPE html>
<html>

<head>

    <title>ShopSense OS - Products</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="layout">


    <!-- Sidebar -->

    <div class="sidebar">

        <h2>ShopSense OS</h2>

        <a href="dashboard.html">🏠 Dashboard</a>

        <a href="vendors.html">🏢 Vendors Control</a>

        <a href="products.html">📦 Products</a>

        <a href="#">📊 Analytics</a>

        <a href="login.html">🚪 Logout</a>

    </div>



    <!-- Main Content -->

    <div class="content">


        <h1>Products Management</h1>


        <h2>Add Product</h2>


        <input 
            type="text"
            id="product_name"
            placeholder="Product Name"
        >


        <input 
            type="text"
            id="category"
            placeholder="Category"
        >


        <input 
            type="number"
            id="price"
            placeholder="Price"
        >


        <button onclick="addProduct()">
            Add Product
        </button>



        <h2>Product List</h2>


        <table>


            <thead>

                <tr>

                    <th>ID</th>

                    <th>Product Name</th>

                    <th>Category</th>

                    <th>Price</th>

                </tr>

            </thead>


            <tbody id="productTable">


            </tbody>


        </table>


    </div>


</div>



<script src="js/product.js"></script>


</body>

</html>
